      <path d="M1300 372 l36 0 -8 56 -20 0 z" fill="#f2e8d0"/>
      <path d="M1296 366 h44 v10 h-44 z" fill="#cfd8dc"/>
      <ellipse cx="1318" cy="360" rx="16" ry="8" fill="#ffd8e1"/>
      <rect x="1322" y="332" width="5" height="30" rx="2.5" fill="#c9354a"/>

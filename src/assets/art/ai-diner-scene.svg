      <rect x="1028" y="706" width="24" height="134" fill="url(#chrome)"/>
      <ellipse cx="1040" cy="706" rx="66" ry="23" fill="#c9354a"/>
      <ellipse cx="1040" cy="698" rx="66" ry="21" fill="#e04a5e"/>

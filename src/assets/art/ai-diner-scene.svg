<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <!-- AI-GENERATED PLACEHOLDER — replace with commissioned art. See ASSETS.md ("ai-diner-scene.svg"). -->
  <!-- 1950s diner interior backdrop. Groups are labeled so pieces can be redrawn or swapped individually. -->

  <defs>
    <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#123833"/>
      <stop offset="1" stop-color="#1b4f4a"/>
    </linearGradient>
    <linearGradient id="chrome" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e8edf0"/>
      <stop offset="0.5" stop-color="#9fb0b8"/>
      <stop offset="0.55" stop-color="#77878f"/>
      <stop offset="1" stop-color="#cfd8dc"/>
    </linearGradient>
    <linearGradient id="counterfront" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f2e3c8"/>
      <stop offset="1" stop-color="#e3cfa9"/>
    </linearGradient>
    <radialGradient id="lampglow" cx="0.5" cy="0.35" r="0.65">
      <stop offset="0" stop-color="#ffe9b0" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#ffe9b0" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="neonglow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ff5f7a" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#ff5f7a" stop-opacity="0"/>
    </radialGradient>
    <pattern id="checker" width="160" height="160" patternUnits="userSpaceOnUse">
      <rect width="160" height="160" fill="#efe4c8"/>
      <rect width="80" height="80" fill="#26221e"/>
      <rect x="80" y="80" width="80" height="80" fill="#26221e"/>
    </pattern>
  </defs>

  <!-- wall -->
  <rect width="1600" height="660" fill="url(#wall)"/>
  <rect y="470" width="1600" height="26" fill="url(#chrome)"/>
  <rect y="496" width="1600" height="164" fill="#c9354a"/>
  <rect y="496" width="1600" height="164" fill="#000" opacity="0.12"/>

  <!-- floor -->
  <rect y="660" width="1600" height="240" fill="url(#checker)"/>
  <rect y="660" width="1600" height="240" fill="#1a1410" opacity="0.25"/>
  <rect y="660" width="1600" height="14" fill="#141110" opacity="0.5"/>

  <!-- window with night sky and neon coffee cup -->
  <g id="window">
    <rect x="80" y="110" width="500" height="420" rx="18" fill="url(#chrome)"/>
    <rect x="98" y="128" width="464" height="384" rx="10" fill="#0e1e2a"/>
    <circle cx="180" cy="180" r="3" fill="#f6edd9" opacity="0.9"/>
    <circle cx="300" cy="150" r="2" fill="#f6edd9" opacity="0.7"/>
    <circle cx="430" cy="200" r="2.5" fill="#f6edd9" opacity="0.8"/>
    <circle cx="510" cy="160" r="2" fill="#f6edd9" opacity="0.6"/>
    <circle cx="240" cy="240" r="2" fill="#f6edd9" opacity="0.5"/>
    <circle cx="470" cy="300" r="60" fill="#f2e8d0" opacity="0.9"/>
    <circle cx="450" cy="285" r="12" fill="#d8cbb0" opacity="0.8"/>
    <circle cx="490" cy="315" r="8" fill="#d8cbb0" opacity="0.8"/>
    <!-- neon cup -->
    <ellipse cx="250" cy="360" rx="150" ry="110" fill="url(#neonglow)"/>
    <g fill="none" stroke="#ff5f7a" stroke-width="7" stroke-linecap="round">
      <path d="M185 340 h120 v70 a20 20 0 0 1 -20 20 h-80 a20 20 0 0 1 -20 -20 z"/>
      <path d="M305 355 h22 a22 22 0 0 1 0 44 h-22"/>
      <path d="M170 445 h160"/>
    </g>
    <g fill="none" stroke="#ffd166" stroke-width="6" stroke-linecap="round" opacity="0.95">
      <path d="M215 320 q-10 -18 4 -34"/>
      <path d="M247 320 q-10 -18 4 -34"/>
      <path d="M279 320 q-10 -18 4 -34"/>
    </g>

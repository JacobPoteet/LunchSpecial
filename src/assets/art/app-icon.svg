<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!-- AI-GENERATED PLACEHOLDER — Discord Activity app icon. Reuses the favicon/cloche brand mark. See ASSETS.md. -->
  <defs>
    <radialGradient id="bg" cx="50%" cy="42%" r="70%">
      <stop offset="0" stop-color="#d84158"/>
      <stop offset="0.55" stop-color="#c9354a"/>
      <stop offset="1" stop-color="#8f1f2e"/>
    </radialGradient>
    <linearGradient id="dome" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#eef3f5"/>
      <stop offset="0.55" stop-color="#c2d0d6"/>
      <stop offset="1" stop-color="#81949c"/>
    </linearGradient>
    <linearGradient id="plate" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f2f6f8"/>
      <stop offset="1" stop-color="#9fb0b8"/>
    </linearGradient>
  </defs>

  <!-- full-bleed background so it reads whether Discord shows it square or circle-masked -->
  <rect width="1024" height="1024" fill="url(#bg)"/>
  <circle cx="512" cy="512" r="470" fill="none" stroke="#f6edd9" stroke-opacity="0.18" stroke-width="10"/>

  <!-- steam wisps -->
  <g fill="none" stroke="#f6edd9" stroke-opacity="0.5" stroke-width="14" stroke-linecap="round">
    <path d="M430 250 c-26 -34 26 -70 0 -104"/>
    <path d="M512 232 c-26 -34 26 -70 0 -104"/>
    <path d="M594 250 c-26 -34 26 -70 0 -104"/>
  </g>

  <!-- cloche shadow -->
  <ellipse cx="512" cy="742" rx="330" ry="34" fill="#3a0d16" opacity="0.35"/>

  <!-- dome -->
  <path d="M172 690 a340 300 0 0 1 680 0 z" fill="url(#dome)"/>
  <!-- highlight -->
  <path d="M262 660 a250 220 0 0 1 210 -206" fill="none" stroke="#ffffff" stroke-width="26" stroke-linecap="round" opacity="0.7"/>
  <!-- knob -->
  <circle cx="512" cy="376" r="40" fill="url(#plate)"/>
  <circle cx="512" cy="376" r="40" fill="none" stroke="#6f8087" stroke-width="4" opacity="0.5"/>
  <!-- plate -->
  <rect x="146" y="690" width="732" height="48" rx="24" fill="url(#plate)"/>

  <!-- mystery mark -->
  <text x="512" y="622" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="300" font-weight="bold" fill="#1b4f4a">?</text>
</svg>

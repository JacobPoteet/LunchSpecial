name: CI

# Runs the full gate — npm test (game + stats + catalog data-integrity) and
# npm run check (tsc) — on every push/PR to main. Fires on all changes, not just
# catalog data, so it's a meaningful required check for the branch ruleset: a
# code-only PR (e.g. a Worker or React change) can't merge with red tests/types.
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # wrangler types derives Env's secret members (ADMIN_PASSWORD, SESSION_SECRET)
      # from .dev.vars, which is gitignored. Give CI a placeholder so the generated
      # Env includes them.
      - run: printf 'ADMIN_PASSWORD=placeholder\nSESSION_SECRET=placeholder\n' > .dev.vars

      # worker-configuration.d.ts (Cloudflare runtime types + Env) is gitignored
      # and generated, so CI must regenerate it before typecheck/build.
      - run: npm run cf-typegen

      - run: npm test
      - run: npm run check

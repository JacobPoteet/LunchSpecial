name: CI

# Runs on push/PR to main, but only when the catalog data (or the test that
# validates it) actually changed — so bad data (e.g. a mistyped enum value in
# a hand-written migration) is caught before merge, without firing on every
# unrelated commit.
on:
  push:
    branches:
      - main
    paths:
      - "migrations/**"
      - "seed/seed.sql"
      - "worker/data-integrity.test.ts"
  pull_request:
    branches:
      - main
    paths:
      - "migrations/**"
      - "seed/seed.sql"
      - "worker/data-integrity.test.ts"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # wrangler types derives Env's secret members (ADMIN_PASSWORD, SESSION_SECRET)
      # from .dev.vars, which is gitignored. Give CI a placeholder so the generated
      # Env includes them.
      - run: printf 'ADMIN_PASSWORD=placeholder\nSESSION_SECRET=placeholder\n' > .dev.vars

      # worker-configuration.d.ts (Cloudflare runtime types + Env) is gitignored
      # and generated, so CI must regenerate it before typecheck/build.
      - run: npm run cf-typegen

      - run: npm test
      - run: npm run check

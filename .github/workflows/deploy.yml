name: Deploy to Cloudflare

# Fires when you push a release tag like v1.0.0 (git tag v1.0.0 && git push origin v1.0.0).
# workflow_dispatch lets you also trigger a deploy by hand from the Actions tab.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

# Never let two deploys race each other.
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # wrangler types derives Env's secret members (ADMIN_PASSWORD, SESSION_SECRET,
      # DISCORD_CLIENT_ID, …) from .dev.vars, which is gitignored. Give the build a
      # placeholder so the generated Env includes them. Values are dummy — the real
      # secrets are set on the Worker itself (wrangler secret put) and are never
      # needed at build time.
      #
      # Derived from the committed .dev.vars.example rather than spelled out, so
      # adding a secret can't break the typecheck here and in ci.yml separately.
      - run: grep -E '^[A-Z_]+=' .dev.vars.example | sed -E 's/=.*/=placeholder/' > .dev.vars

      # worker-configuration.d.ts (Cloudflare runtime types + Env) is gitignored
      # and generated, so CI must regenerate it before typecheck/build.
      - run: npm run cf-typegen

      # Gate the deploy on the same checks CLAUDE.md prescribes.
      - run: npm test
      - run: npm run check

      # Apply any new D1 migrations to the production database.
      # Idempotent: wrangler tracks which migrations have already run.
      # NOTE: we deliberately do NOT run the seed here — seed/seed.sql DELETEs and
      # re-inserts every dish, which would wipe out edits made through /admin.
      - run: npx wrangler d1 migrations apply lunch-special-db --remote

      # build (tsc -b && vite build) + wrangler deploy.
      # VITE_DISCORD_CLIENT_ID is a public build-time var baked into the client
      # bundle so the app can run as a Discord Activity. Set it as a repo
      # Actions *variable* (Settings → Secrets and variables → Actions →
      # Variables), not a secret. If unset it's empty and only the Discord
      # Activity path is affected — the public website builds normally.
      - run: npm run deploy
        env:
          VITE_DISCORD_CLIENT_ID: ${{ vars.VITE_DISCORD_CLIENT_ID }}

<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="Lunch Special: guess the diner's daily Special. A new dish every day." />
    <meta name="theme-color" content="#1b4f4a" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <title>Lunch Special: the daily dish guessing game</title>

    <!-- Every game mode is this same shell on a query string (?date=, ?random,
         ?preview=), and the SPA fallback serves it for unknown paths too, so
         all of them canonicalise to the root rather than splitting ranking
         across one URL per puzzle day. The static /privacy, /terms and /press
         pages are real files with their own canonical tags. -->
    <link rel="canonical" href="https://lunchspecial.app/" />

    <!-- Installable web app. A daily game lives or dies on coming back, and an
         icon on the home screen is the cheapest version of that. -->
    <link rel="manifest" href="/manifest.json" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Lunch Special" />
    <!-- black-translucent lets the diner backdrop run under the status bar;
         viewport-fit=cover above is what keeps content out of the notch. -->
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />

    <!-- Open Graph (Facebook, LinkedIn, iMessage, etc.) -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Lunch Special" />
    <meta property="og:url" content="https://lunchspecial.app/" />
    <meta property="og:title" content="Lunch Special: the daily dish guessing game" />
    <meta property="og:description" content="Guess the diner's daily Special — a famous dish from somewhere in the world. A new one every day." />
    <meta property="og:image" content="https://lunchspecial.app/og-image.jpg" />
    <meta property="og:image:type" content="image/jpeg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Lunch Special — the daily dish guessing game, over a 1950s diner scene" />

    <!-- Twitter / X card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Lunch Special: the daily dish guessing game" />
    <meta name="twitter:description" content="Guess the diner's daily Special — a famous dish from somewhere in the world. A new one every day." />
    <meta name="twitter:image" content="https://lunchspecial.app/og-image.jpg" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
